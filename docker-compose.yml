
version: "3.9"
services:

  # PostgreSQL Database
  db:
    image  : postgres:15-alpine   
    restart: always         
    environment:
      POSTGRES_DB      : bi_copilot    
      POSTGRES_USER    : bi_user      
      POSTGRES_PASSWORD: bi_password  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"    
    healthcheck:
      test    : ["CMD-SHELL", "pg_isready -U bi_user -d bi_copilot"]
      interval: 5s
      timeout : 5s
      retries : 5

  # Redis Cache
  redis:
    image  : redis:7-alpine   
    restart: always
    ports  :
      - "6379:6379"
    volumes:
      - redis_data:/data   
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Backend
  backend:
    build  : ./backend   
    restart: always
    ports  :
      - "8000:8000"
    environment:
      DATABASE_URL   : postgresql://bi_user:bi_password@db:5432/bi_copilot
      REDIS_HOST     : redis    
      REDIS_PORT     : "6379"
      JWT_SECRET_KEY : your_super_secret_jwt_key_change_this
      OPENAI_API_KEY : ${OPENAI_API_KEY}   
    depends_on:
      db:
        condition: service_healthy    
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  # React Frontend
  frontend:
    build  : ./frontend   
    restart: always
    ports  :
      - "80:80"   
    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data: